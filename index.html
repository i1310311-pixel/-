<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>🎄 聖誕射擊遊戲</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#0a2a66, #0f4fa8);
    font-family: Arial;
}

/* HUD */
#hud {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    font-size: 18px;
    z-index: 10;
}

/* 遊戲區 */
#gameArea {
    position: relative;
    width: 100%;
    height: 100%;
}

/* 玩家 */
#player {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    pointer-events: none;
    z-index: 5;
}

/* 子彈 */
.bullet {
    position: absolute;
    font-size: 22px;
    pointer-events: none;
}

/* 一般敵人 */
.enemy {
    position: absolute;
    font-size: 36px;
    user-select: none;
}

/* Boss */
.boss {
    position: absolute;
    font-size: 72px;
    user-select: none;
}

/* 雪花背景 */
.snow {
    position: fixed;
    top: -10px;
    color: white;
    pointer-events: none;
    user-select: none;
}
</style>
</head>

<body>

<div id="hud">
分數：<span id="score">0</span>
<span id="bossHp"></span>
</div>

<div id="gameArea"></div>
<div id="player">🎅</div>

<script>
const gameArea = document.getElementById("gameArea");
const scoreText = document.getElementById("score");
const bossHpText = document.getElementById("bossHp");

let score = 0;
let enemies = [];
let boss = null;
let bossHP = 0;

/* 滑鼠移動控制 */
window.addEventListener("mousemove", e => {
    document.getElementById("player").style.left = e.clientX + "px";
});

/* 滑鼠射擊 */
window.addEventListener("mousedown", e => {
    shoot(e.clientX);
});

function shoot(x) {
    const bullet = document.createElement("div");
    bullet.className = "bullet";
    bullet.innerText = "❄";
    bullet.style.left = x + "px";
    bullet.style.top = (window.innerHeight - 70) + "px";
    gameArea.appendChild(bullet);

    let y = window.innerHeight - 70;
    const move = setInterval(() => {
        y -= 12;
        bullet.style.top = y + "px";

        /* 打 Boss */
        if (boss) {
            const r = boss.getBoundingClientRect();
            if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
                bossHP--;
                bossHpText.innerText = ` ｜ 👹 HP:${bossHP}`;
                bullet.remove();
                clearInterval(move);

                if (bossHP <= 0) {
                    score += 15;
                    scoreText.innerText = score;
                    boss.remove();
                    boss = null;
                    bossHpText.innerText = "";
                }
                return;
            }
        }

        /* 打一般敵人 */
        enemies.forEach((enemy, index) => {
            const r = enemy.getBoundingClientRect();
            if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
                score += enemy.dataset.type === "gift" ? 1 : -2;
                scoreText.innerText = score;
                enemy.remove();
                enemies.splice(index, 1);
                bullet.remove();
                clearInterval(move);
            }
        });

        if (y < 0) {
            bullet.remove();
            clearInterval(move);
        }
    }, 16);
}

/* 一般敵人生成 */
function spawnEnemy() {
    if (boss) return;

    const enemy = document.createElement("div");
    enemy.className = "enemy";

    const isGift = Math.random() > 0.3;
    enemy.innerText = isGift ? "🎁" : "💣";
    enemy.dataset.type = isGift ? "gift" : "bomb";

    enemy.style.left = Math.random() * (window.innerWidth - 40) + "px";
    enemy.style.top = "-40px";

    gameArea.appendChild(enemy);
    enemies.push(enemy);

    let y = -40;
    const fall = setInterval(() => {
        y += 3;
        enemy.style.top = y + "px";
        if (y > window.innerHeight) {
            clearInterval(fall);
            enemy.remove();
        }
    }, 20);
}

/* Boss 出現 */
function spawnBoss() {
    if (boss) return;
    boss = document.createElement("div");
    boss.className = "boss";
    boss.innerText = "👹";
    bossHP = 18;
    bossHpText.innerText = ` ｜ 👹 HP:${bossHP}`;

    boss.style.left = (window.innerWidth / 2 - 36) + "px";
    boss.style.top = "70px";
    gameArea.appendChild(boss);
}

/* 分數觸發 Boss */
setInterval(() => {
    if (score > 0 && score % 20 === 0 && !boss) {
        spawnBoss();
    }
}, 1000);

/* 一般敵人產生 */
setInterval(spawnEnemy, 700);

/* ❄ 白色雪花背景 */
function createSnow() {
    const snow = document.createElement("div");
    snow.className = "snow";
    snow.innerText = "❄";
    snow.style.left = Math.random() * window.innerWidth + "px";
    snow.style.fontSize = Math.random() * 10 + 12 + "px";
    document.body.appendChild(snow);

    let y = -10;
    const fall = setInterval(() => {
        y += 1.2;
        snow.style.top = y + "px";
        if (y > window.innerHeight) {
            clearInterval(fall);
            snow.remove();
        }
    }, 30);
}
setInterval(createSnow, 180);
</script>

</body>
</html>
